demo, actions,</text><text x="648" y="409" fill="#233f37" font-family="Arial,sans-serif" font-size="22" font-weight="400">counts and an unaided result; no learning</text><text x="648" y="443" fill="#233f37" font-family="Arial,sans-serif" font-size="22" font-weight="400">effect is claimed.</text><path d="M580 270 L620 270" stroke="#526a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>