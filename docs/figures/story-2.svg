<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526a60"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="26" y="40" fill="#233f37" font-family="Arial,sans-serif" font-size="29" font-weight="600">Example 2  Checking a line of working for 2x + 3 = 11</text><rect x="25" y="70" width="550" height="395" rx="14" fill="#f6f8f4" stroke="#cdd8d0" stroke-width="2"/><text x="48" y="110" fill="#233f37" font-family="Arial,sans-serif" font-size="27" font-weight="600">Changed solution</text><text x="48" y="155" fill="#233f37" font-family="Arial,sans-serif" font-size="24" font-weight="400">User enters: 2x = 14</text><rect x="45" y="235" width="510" height="95" rx="7" fill="#e6eee7"/><text x="60" y="268" fill="#233f37" font-family="Arial,sans-serif" font-size="24" font-weight="400">This line changes the original</text><text x="60" y="302" fill="#233f37" font-family="Arial,sans-serif" font-size="24" font-weight="400">solution.</text><text x="48" y="375" fill="#233f37" font-family="Arial,sans-serif" font-size="22" font-weight="400">No additional worked step is released. The</text><text x="48" y="409" fill="#233f37" font-family="Arial,sans-serif" font-size="22" font-weight="400">learner can correct the line.</text><rect x="625" y="70" width="550" height="395" rx="14" fill="#f6f8f4" stroke="#cdd8d0" stroke-width="2"/><text x="648" y="110" fill="#233f37" font-family="Arial,sans-serif" font-size="27" font-weight="600">Equivalent line</text><text x="648" y="155" fill="#233f37" font-family="Arial,sans-serif" font-size="24" font-weight="400">User corrects the line: 2x = 8</text><rect x="645" y="235" width="510" height="95" rx="7" fill="#e6eee7"/><text x="660" y="268" fill="#233f37" font-family="Arial,sans-serif" font-size="24" font-weight="400">Equivalent equation. Continue your own</text><text x="660" y="302" fill="#233f37" font-family="Arial,sans-serif" font-size="24" font-weight="400">work.</text><text x="648" y="375" fill="#233f37" font-family="Arial,sans-serif" font-size="22" font-weight="400">This checks equivalence, not why the</text><text x="648" y="409" fill="#233f37" font-family="Arial,sans-serif" font-size="22" font-weight="400">learner selected the operation.</text><path d="M580 270 L620 270" stroke="#526a60" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>